services:

  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      
    
  cloudbeaver:
    image: dbeaver/cloudbeaver:26.2.3
    restart: always
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - cloudbeaver:/opt/cloudbeaver/workspace

  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -dir=/data -s3.port=8333
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3_data:/data

volumes:
  pgdata:
  cloudbeaver:
  s3_data: